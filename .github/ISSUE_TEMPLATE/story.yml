name: User story
description: A piece of work from the backlog
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a [role], I want [thing], so that [reason].
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. Each item can be tested.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [core, personnel, access, events, notifications, monitoring, information, records]
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [desktop, mobile, both]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S, M, L]
