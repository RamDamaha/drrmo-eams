# /etc/nginx/sites-available/drrmo
# Replace drrmo.example.edu.ph with the real domain. Certbot adds the HTTPS lines.
server {
    listen 80;
    server_name drrmo.example.edu.ph;
    root /var/www/drrmo/current/public;
    index index.php;

    client_max_body_size 12M;   # memo files up to 10 MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
