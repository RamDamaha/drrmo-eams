; /etc/supervisor/conf.d/drrmo-queue.conf
[program:drrmo-queue]
command=/usr/bin/php /var/www/drrmo/current/artisan queue:work --tries=3 --backoff=60,300,900 --max-time=3600
user=deploy
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/drrmo/shared/storage/logs/queue.log
